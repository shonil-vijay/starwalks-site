<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="StarWalks">
  <defs>
    <linearGradient id="starFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdc5c"/>
      <stop offset="1" stop-color="#f59a2b"/>
    </linearGradient>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.2" flood-color="#ffd54a" flood-opacity="0.55"/>
    </filter>
  </defs>
  <!-- Golden star (rounded via a matching stroke), matching the app icon -->
  <g filter="url(#starGlow)">
    <path d="M50 5 L62.9 32.2 L92.8 36.1 L70.9 56.8 L76.5 86.4 L50 72 L23.5 86.4 L29.1 56.8 L7.2 36.1 L37.1 32.2 Z"
          fill="url(#starFill)" stroke="url(#starFill)" stroke-width="6" stroke-linejoin="round"/>
  </g>
  <!-- Walking figure, mid-stride, matching the icon's navy silhouette -->
  <g stroke="#171438" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M52 36 L49 53"/>
    <path d="M49 53 L42 66"/>
    <path d="M49 53 L56 59 L58 68"/>
    <path d="M51 41 L44 47"/>
    <path d="M51 41 L59 45"/>
  </g>
  <circle cx="53" cy="30" r="5.5" fill="#171438"/>
</svg>
